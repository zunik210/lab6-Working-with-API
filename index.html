<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NOW SHOWING | Movie Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <h1 class="logo">NOW<span>SHOWING</span></h1>

        <div class="nav-links">
            <a href="#now-playing">Now Playing</a>
            <a href="#coming-soon">Coming Soon</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h2>DISCOVER YOUR NEXT MOVIE</h2>
            <p>Explore what's playing now and what's coming soon.</p>
        </div>
    </header>

     <!-- Search Section -->
    <main>
        <section class="search-section">
            <input
                type="text"
                id="movie-search"
                placeholder="Search for a movie..."
            >
        </section>

    <!-- Now Playing Section -->
        <section id="now-playing" class="movie-section">
            <h2>Now Playing</h2>
            <div id="now-playing-movies" class="movie-grid">
                <!-- Movie cards will be added here using JavaScript -->
            </div>
        </section>

    <!-- Coming Soon Section -->
        <section id="coming-soon" class="movie-section">
            <h2>Coming Soon</h2>
            <div id="coming-soon-movies" class="movie-grid">
                <!-- Movie cards will be added here using JavaScript -->
            </div>
        </section>
    </main>

     <!-- Footer -->
    <footer>
        <p>Movie information provided by TMDB.</p>
    </footer>

    <script src="script.js"></script>

</body>
